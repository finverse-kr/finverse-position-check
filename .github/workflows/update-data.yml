name: Update stock data

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stock data
        run: python3 fetch_stocks.py
      - name: Commit if changed
        run: |
          git config user.name "finverse-bot"
          git config user.email "bot@finverse.local"
          git add data.json stocks.json
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
